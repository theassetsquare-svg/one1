name: Schema + Content Validate
on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy
        if: github.event_name == 'push'
        run: sleep 180

      - name: Required content present on home
        run: |
          set -e
          # 홈은 독립 성공스토리 단독 페이지 (본문 링크·업소 표기·전화번호 금지)
          H=$(curl -sL https://onee-w8t.pages.dev/)
          echo "$H" | grep -q "다시 시작하는 데 필요한 건" || { echo "MISSING 스토리 표제"; exit 1; }
          echo "$H" | grep -q "바닥은, 처음으로 발이 닿는 곳입니다" || { echo "MISSING 스토리 결말"; exit 1; }
          if echo "$H" | grep -q "나이트"; then echo "FAIL 홈에 금칙어 노출"; exit 1; fi
          if echo "$H" | grep -qE 'href="/(info|hours|ladies|faq|contact|start/|bulgwangdong-hobak)'; then echo "FAIL 홈 본문 내부 링크 노출"; exit 1; fi
          if echo "$H" | grep -qE "010[- ][0-9]{3,4}[- ][0-9]{4}"; then echo "FAIL 홈에 전화번호 노출"; exit 1; fi
          # 대전원나이트 안내 문구는 하위 페이지에서 확인
          I=$(curl -sL https://onee-w8t.pages.dev/info)
          echo "$I" | grep -q "38세 이상" || { echo "MISSING 38세 이상 (info)"; exit 1; }
          echo "$I" | grep -q "광고문의 카톡 besta12" || { echo "MISSING kakao contact (info)"; exit 1; }
          L=$(curl -sL https://onee-w8t.pages.dev/ladies)
          echo "$L" | grep -q "교통비" || { echo "MISSING 교통비 (ladies)"; exit 1; }
          echo "$L" | grep -q "맥주" || { echo "MISSING 맥주 (ladies)"; exit 1; }
          # 입문 노트 허브
          S=$(curl -sL https://onee-w8t.pages.dev/start/)
          echo "$S" | grep -q "전국 나이트 입문 노트 40" || { echo "MISSING 허브 제목"; exit 1; }
          echo "OK content"

      - name: Schema.org types present
        run: |
          set -e
          H=$(curl -sL https://onee-w8t.pages.dev/)
          for t in WebSite Article BreadcrumbList; do
            echo "$H" | grep -q "\"$t\"" || { echo "MISSING schema $t (home)"; exit 1; }
            echo "OK schema $t (home)"
          done
          I=$(curl -sL https://onee-w8t.pages.dev/info)
          for t in WebSite NightClub LocalBusiness BreadcrumbList HowTo GeoCoordinates OpeningHoursSpecification; do
            echo "$I" | grep -q "\"$t\"" || { echo "MISSING schema $t (info)"; exit 1; }
            echo "OK schema $t (info)"
          done
          S=$(curl -sL https://onee-w8t.pages.dev/start/)
          for t in ItemList BreadcrumbList; do
            echo "$S" | grep -q "\"$t\"" || { echo "MISSING schema $t (start hub)"; exit 1; }
            echo "OK schema $t (start hub)"
          done

      - name: 라이브 썸네일 실측 (HTTP 200 + image/png + 본문 img · 홈은 메타만)
        run: |
          set -e
          for u in /og/home.png /og/info.png /og/hobak.png /og/night-hub-og.png /og/start-hub-og.png /og/cheongdam-night-og.png /og/start-sillim-grandprix-og.png; do
            CT=$(curl -sIL -o /dev/null -w '%{http_code} %{content_type}' "https://onee-w8t.pages.dev$u")
            case "$CT" in "200 image/png"*) echo "OK $u ($CT)";; *) echo "FAIL $u ($CT)"; exit 1;; esac
          done
          # 본문 썸네일 + thumbnail 메타 (홈 제외 — 홈은 독립 성공스토리라 본문 이미지를 싣지 않는다)
          for p in /info /bulgwangdong-hobak /night/ /start/ /night/cheongdam-night/ /start/sillim-grandprix/; do
            H=$(curl -sL "https://onee-w8t.pages.dev$p")
            echo "$H" | grep -q '<img[^>]*src="/og/' || { echo "FAIL $p 본문 img 없음"; exit 1; }
            echo "$H" | grep -q '<meta name="thumbnail"' || { echo "FAIL $p thumbnail 메타 없음"; exit 1; }
            echo "OK $p"
          done
          # 홈 — 본문 img 는 0개여야 하고, thumbnail/og:image 메타는 있어야 한다
          H=$(curl -sL "https://onee-w8t.pages.dev/")
          if echo "$H" | grep -q '<img'; then echo "FAIL / 홈에 본문 img 존재"; exit 1; fi
          echo "$H" | grep -q '<meta name="thumbnail"' || { echo "FAIL / thumbnail 메타 없음"; exit 1; }
          echo "$H" | grep -q 'og:image" content="https://onee-w8t.pages.dev/og/home.png"' || { echo "FAIL / og:image 없음"; exit 1; }
          echo "OK / (본문 img 0 · 메타 유지)"

      - name: No fake AggregateRating
        run: |
          if curl -sL https://onee-w8t.pages.dev/ | grep -q "AggregateRating"; then
            echo "FAIL: fake AggregateRating detected"
            exit 1
          fi
          echo "OK no fake ratings"
