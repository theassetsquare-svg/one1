name: Build + Audit (keywords, html, schema)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Keyword stuffing audit
        run: node scripts/audit-keywords.js out

      - name: HTML quality audit
        run: node scripts/audit-html.js out

      - name: Required content present in build
        run: |
          set -e
          # 대전원나이트 하위 페이지: 연령 완전문 + 카톡 표기
          for f in out/info.html out/hours.html out/ladies.html out/faq.html out/contact.html; do
            grep -q "38세 이상" "$f" || { echo "FAIL $f missing 38세 이상"; exit 1; }
            grep -q "광고문의 카톡 besta12" "$f" || { echo "FAIL $f missing kakao contact"; exit 1; }
          done
          # 홈은 입문 노트 랜딩: 특정 가게 간판·전화번호 금지, 광고문의 카카오톡 표기
          H=out/index.html
          grep -q "생애 첫 나이트" "$H" || { echo "FAIL $H missing 입문 노트 브랜드"; exit 1; }
          grep -q "광고문의 카카오톡 besta12" "$H" || { echo "FAIL $H missing kakao contact"; exit 1; }
          grep -q "/start/" "$H" || { echo "FAIL $H missing /start/ link"; exit 1; }
          if grep -qE "010[- ][0-9]{3,4}[- ][0-9]{4}" "$H"; then echo "FAIL $H phone number present"; exit 1; fi
          echo "OK content"

      - name: 불광동호박나이트 page content present
        run: |
          set -e
          F=out/bulgwangdong-hobak.html
          grep -q "불광동호박나이트" "$F" || { echo "FAIL $F missing 불광동호박나이트"; exit 1; }
          grep -q "010 2221 1937" "$F" || { echo "FAIL $F missing 예약문의 전화"; exit 1; }
          grep -q "\"FAQPage\"" "$F" || { echo "FAIL $F missing FAQPage schema"; exit 1; }
          grep -q "\"NightClub\"" "$F" || { echo "FAIL $F missing NightClub schema"; exit 1; }
          echo "OK 불광동호박나이트"

      - name: Schema types present in build
        run: |
          set -e
          # 대전원나이트 스키마는 하위 페이지 기준
          for t in WebSite NightClub LocalBusiness BreadcrumbList HowTo GeoCoordinates OpeningHoursSpecification; do
            grep -q "\"$t\"" out/info.html || { echo "FAIL schema $t (info)"; exit 1; }
          done
          # 홈(입문 노트 랜딩) 스키마
          for t in WebSite DefinedTermSet FAQPage BreadcrumbList; do
            grep -q "\"$t\"" out/index.html || { echo "FAIL schema $t (index)"; exit 1; }
          done
          echo "OK schema"

      - name: No fake AggregateRating
        run: |
          if grep -l "AggregateRating" out/*.html >/dev/null 2>&1; then
            echo "FAIL: AggregateRating present"
            exit 1
          fi
          echo "OK no fake ratings"
